[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-alpha"
version = "0.1.0"
description = "Dual-loop framework for alpha feature discovery and online monitoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "numpy>=1.26.0",
  "openai>=1.40.0",
  "pandas>=1.5.0",
  "PyYAML>=6.0.0",
  "scikit-learn>=1.5.0",
  "sortedcontainers>=2.4.0",
]

[project.scripts]
midas = "midas.factory:_cli"

[project.optional-dependencies]
# Discovery + feature extraction. Works on Python >= 3.11.
nq = [
  "vectorbt>=1.0",
  "mlflow>=3.12",
  "databento>=0.78",
]

# Backtest workstream. Pulls in nautilus_trader.
# Note: nautilus_trader >= 1.227 requires Python >= 3.12.
# On Python 3.11 environments (e.g. RunPod PyTorch py3.11 images), pip will
# resolve down to the latest 3.11-compatible release (currently 1.221).
backtest = [
  "midas-alpha[nq]",
  "nautilus_trader[databento]>=1.220",
]

[tool.setuptools]
packages = ["midas", "midas.adapters"]
